<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pour toi</title>
<style>
  :root {
    --nuit: #24203A;
    --nuit-clair: #3A3358;
    --papier: #F7F1F3;
    --encre: #2A2438;
    --gris: #6B6178;
    --rose: #C9788F;
    --rose-fonce: #B4647C;
    --rose-doux: #E9C9D3;
    --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, var(--nuit-clair) 0%, var(--nuit) 70%) fixed;
    color: var(--encre);
    font-family: var(--serif);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .carte {
    width: 100%;
    max-width: 440px;
    background: var(--papier);
    border-radius: 6px;
    padding: 56px 40px 48px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(10, 8, 25, 0.45);
    position: relative;
  }
  .carte::before {
    content: "";
    position: absolute;
    inset: 12px;
    border: 1px solid var(--rose-doux);
    border-radius: 3px;
    pointer-events: none;
  }
  h1, h2 { font-weight: 400; font-style: italic; margin: 0; }
  h1 { font-size: clamp(2.4rem, 9vw, 3.2rem); line-height: 1.1; margin-bottom: 8px; }
  h2 { font-size: 2.1rem; margin-bottom: 20px; }
  p { margin: 0 0 18px; font-size: 1.15rem; line-height: 1.6; }
  .sous-titre { margin-bottom: 40px; font-size: 1.05rem; color: var(--gris); }

  button, a.bouton {
    font-family: var(--serif);
    font-size: 1.05rem;
    color: var(--papier);
    background: var(--rose);
    border: 1px solid var(--rose);
    border-radius: 999px;
    padding: 14px 36px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: background 0.2s;
  }
  button:hover, a.bouton:hover { background: var(--rose-fonce); }
  button.secondaire { background: transparent; color: var(--encre); }
  button.secondaire:hover { background: var(--rose-doux); }
  button:disabled { opacity: 0.6; cursor: default; }
  button:focus-visible, a.bouton:focus-visible, input:focus-visible {
    outline: 3px solid var(--nuit);
    outline-offset: 3px;
  }

  .ecran { display: none; }
  .ecran.actif { display: block; animation: apparait 0.8s ease backwards; }
  @keyframes apparait { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .reste { visibility: hidden; }
  #e-question.revelation.actif { animation-duration: 2.2s; }
  #q-choix { transition: opacity 2s ease; }
  #q-mot[hidden] { display: none; }
  #q-mot { margin-top: 18px; }
  .conf { margin: 0; font-size: 1.15rem; font-style: italic; }
  #q-mot-champ[hidden] { display: none; }
  #non.choisi { background: var(--rose-doux); box-shadow: 0 0 0 3px var(--rose-doux); }
  #oui.choisi { box-shadow: 0 0 0 3px var(--rose-doux), 0 6px 16px rgba(36,32,58,0.25); }
  #q-choix.cache { opacity: 0; pointer-events: none; }
  .choix[hidden] { display: none; }
  .choix { display: flex; flex-direction: column; gap: 12px; align-items: center; margin-top: 28px; }

  .champ { text-align: left; margin-bottom: 18px; }
  .champ label { display: block; font-size: 1rem; color: var(--gris); margin-bottom: 6px; }
  .champ textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 1.05rem; padding: 12px 14px; border: 1px solid var(--rose-doux); border-radius: 8px; background: #fff; color: var(--encre); resize: vertical; min-height: 140px; }
  .champ textarea:focus { outline: 2px solid var(--nuit); outline-offset: 1px; }
  .champ input {
    width: 100%;
    font-family: var(--serif);
    font-size: 1.1rem;
    color: var(--encre);
    background: #fff;
    border: 1px solid var(--rose-doux);
    border-radius: 6px;
    padding: 12px 14px;
  }
  .erreur { color: #9B2C4A; font-size: 1rem; margin: 0 0 16px; }
  .erreur[hidden] { display: none; }
  .guirlande { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 10px 0; }
  .fleur { animation: balance 6s ease-in-out infinite alternate; transform-origin: 50% 50%; }
  .fleur:nth-child(even) { animation-delay: -3s; }
  .fleur:nth-child(3n) { animation-duration: 8s; }
  @keyframes balance { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
  #rappel { margin-top: 20px; }
  /* Enveloppe */
  .enveloppe, .enveloppe:hover {
    position: relative;
    display: block;
    width: min(260px, 70vw);
    height: 170px;
    margin: 92px auto 8px;
    padding: 0;
    background: none;
    border: 0;
    border-radius: 0;
    perspective: 900px;
    cursor: pointer;
  }
  .enveloppe > span { position: absolute; }
  .env-corps { inset: 0; background: #DDA3B5; border-radius: 6px; box-shadow: 0 10px 24px rgba(36, 32, 58, 0.25); }
  .env-lettre {
    left: 14px; right: 14px; top: 12px; height: 140px;
    background: #fff;
    border-radius: 3px;
    z-index: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; font-style: italic; color: var(--encre);
    box-shadow: 0 1px 4px rgba(36, 32, 58, 0.15);
    transition: transform 0.9s cubic-bezier(.3,.7,.3,1) 0.55s;
  }
  .env-poche {
    inset: 0; z-index: 2;
    background: #EBC3D0;
    clip-path: polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%);
    border-radius: 6px;
  }
  .env-rabat {
    left: 0; right: 0; top: 0; height: 92px; z-index: 3;
    background: #D590A6;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: 50% 0;
    transition: transform 0.6s ease, z-index 0s 0.3s;
  }
  .env-sceau {
    left: 50%; top: 92px; width: 38px; height: 38px; margin: -19px 0 0 -19px; z-index: 4;
    border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(36, 32, 58, 0.3);
    transition: opacity 0.25s;
  }
  .enveloppe:not(.ouverte-env):hover .env-rabat { transform: rotateX(8deg); }
  .enveloppe.ouverte-env { cursor: default; }
  .ouverte-env .env-sceau { opacity: 0; }
  .ouverte-env .env-rabat { transform: rotateX(180deg); z-index: 0; }
  .ouverte-env .env-lettre { transform: translateY(-96px); }
  .enveloppe:focus-visible { outline: 3px solid var(--nuit); outline-offset: 8px; }
  /* Compte à rebours et scène musicale en fondu croisé */
  .zone { display: grid; align-items: center; }
  #bloc-attente, #scene { grid-area: 1 / 1; }
  #bloc-attente { opacity: 1; visibility: visible; transition: opacity 3s ease, visibility 0s 0s; }
  #scene { opacity: 0; visibility: hidden; transition: opacity 3s ease, visibility 0s 3s; }
  .zone.musique #bloc-attente { opacity: 0; visibility: hidden; transition: opacity 3s ease, visibility 0s 3s; }
  .zone.musique #scene { opacity: 1; visibility: visible; transition: opacity 3s ease, visibility 0s 0s; }
  .cadre-video { margin: 4px 0 10px; }
  .film { display: block; width: 100%; aspect-ratio: 300 / 190; border-radius: 10px; background: #0d1020; box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
  /* Immersion : le film s'ouvre en iris et occupe tout l'écran, puis se referme au retour du compte à rebours */
  #noir { position: fixed; inset: 0; z-index: 59; background: #05060d; opacity: 0; pointer-events: none; }
  body.noircit #noir { opacity: 1; transition: opacity 10s linear; }
  .zone.musique #scene { transition: opacity 8s ease-in-out, visibility 0s 0s; }
  .plein #scene { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 0 5vh;
    background: radial-gradient(ellipse at 50% 42%, #151a33 0%, #07080f 78%); }
  .plein.sort #scene { animation: reprend 3s ease-in both; }
  .plein #scene .cadre-video { width: 100%; max-width: 1000px; margin: 0;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 16%, #000 84%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 16%, #000 84%, transparent 100%); }
  .plein #scene .film { border-radius: 0; box-shadow: none; background: transparent; }
  .bas-scene { display: grid; width: 100%; max-width: 30rem; align-items: center; justify-items: center; }
  .bas-scene > * { grid-area: 1 / 1; }
  #voile { position: absolute; inset: 0; z-index: 1; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.4s linear; }
  #gros { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; margin: 0; font-size: min(46vw, 15rem); font-style: italic; color: #fff;
    text-shadow: 0 0 40px rgba(255,255,255,0.4); opacity: 0; pointer-events: none; transition: opacity 1.5s ease; }
  body.fin10 #gros { opacity: 1; }
  body.finale.fin10 .compte-blanc { opacity: 0; transition: opacity 0.8s ease; }
  .compte-blanc { position: relative; z-index: 2; margin: 20px 0 0; width: 100%; text-align: center; font-size: 2.2rem; font-style: italic; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.35); opacity: 0; transition: opacity 2.5s ease; }
  body.finale .compte-blanc { opacity: 1; }
  body.finale #scene .ligne { opacity: 0 !important; }
  .plein #scene .ligne { color: #dfe4f2; max-width: 30rem; padding: 0 26px; margin: 20px 0 0; }
  .plein #scene #lancer { margin-top: 8px; }
  @keyframes absorbe { from { clip-path: circle(0% at 50% 45%); } to { clip-path: circle(85% at 50% 45%); } }
  @keyframes reprend { from { clip-path: circle(85% at 50% 45%); } to { clip-path: circle(0% at 50% 45%); } }
  .grande-fleur { animation: tourne 24s linear infinite, bat 4s ease-in-out infinite; }
  @keyframes tourne { to { transform: rotate(360deg); } }
  @keyframes bat { 0%,100% { scale: 0.92; } 50% { scale: 1.08; } }
  .ligne { min-height: 7.4rem; font-size: 1.02rem; font-style: italic; line-height: 1.5; margin: 0 0 12px; transition: opacity 0.7s ease; }
  #son { margin-top: 12px; }
  /* Ambiance mélancolique : arrive très lentement pendant que le compte à rebours est caché */
  .ecran { position: relative; z-index: 1; }
  .carte.nuit { background-color: var(--fond); }
  .carte.nuit::before { border-color: var(--trait); }
  .carte.nuit h1 { color: var(--titre); }
  .carte.nuit .sous-titre { color: var(--sous); }
  .carte.nuit .ligne { color: var(--texte); }
  .carte.nuit .grande-fleur { filter: grayscale(calc(var(--n) * 85%)) brightness(calc(1 - var(--n) * 0.22)); opacity: calc(1 - var(--n) * 0.3); }
  .ciel { position: absolute; inset: 0; overflow: hidden; border-radius: 6px; pointer-events: none; z-index: 0; display: none; opacity: var(--n, 0); }
  .carte.nuit .ciel { display: block; }
  .ciel .goutte { position: absolute; top: -60px; width: 1px; background: linear-gradient(to bottom, rgba(190, 205, 230, 0), rgba(190, 205, 230, 0.55)); transform: rotate(12deg); animation: pluie linear infinite; }
  .ciel .petale { position: absolute; top: -40px; opacity: 0.7; filter: grayscale(calc(var(--n, 0) * 80%)); animation: chute linear infinite; }
  .ciel .brume { position: absolute; left: -30%; bottom: -50px; width: 160%; height: 200px; background: radial-gradient(ellipse at center, rgba(190, 203, 224, 0.38), rgba(190, 203, 224, 0) 68%); animation: derive 26s ease-in-out infinite alternate; }
  .ciel .brume.b2 { bottom: 120px; height: 160px; opacity: 0.6; animation-duration: 34s; animation-direction: alternate-reverse; }
  @keyframes pluie { from { transform: translate(0, 0) rotate(12deg); } to { transform: translate(120px, 700px) rotate(12deg); } }
  @keyframes chute {
    0%   { transform: translate(0, 0) rotate(0deg); }
    50%  { transform: translate(var(--dx), 330px) rotate(150deg); }
    100% { transform: translate(0, 680px) rotate(300deg); }
  }
  @keyframes derive { from { transform: translateX(-12%); } to { transform: translateX(12%); } }
  .date-ouverture { margin: 0 0 12px; color: var(--gris); font-size: 1.05rem; }
  .compte { font-size: 1.7rem; font-style: italic; margin: 0 0 8px; min-height: 2.4rem; }
  button[hidden] { display: none; }
  .aide { margin: 28px 0 0; font-size: 0.95rem; color: var(--gris); }
  .aide em { color: var(--encre); }
  .trait { width: 48px; height: 1px; background: var(--rose); margin: 24px auto; border: 0; }

  @media (prefers-reduced-motion: reduce) {
    .ecran.actif { animation: none; }
    .plein.sort #scene { animation: none; }
    #voile { transition: none; }
    body.noircit #noir { transition: none; }
    #bloc-attente, #scene, .ligne { transition: none !important; }
    .grande-fleur { animation: none; }
    .ciel .goutte, .ciel .petale, .ciel .brume { animation: none; }
    .ciel .goutte, .ciel .petale { display: none; }
    #q-choix { transition: none; }
    .fleur { animation: none; }
    .env-rabat, .env-lettre, .env-sceau { transition: none; }
    button, a.bouton { transition: none; }
  }
  @media (max-width: 420px) { .carte { padding: 48px 24px 40px; } }
</style>
</head>
<body>
  <main class="carte">
    <section class="ecran actif" id="garde">
      <h2>Avant d'entrer</h2>
      <p>Je suis verte, je t'ai déjà fait gronder. Tu es connue de quelqu'un pour m'avoir volée, ce qui t'a valu un surnom bien particulier. Qui suis-je&nbsp;?</p>
      <form id="formulaire-garde" novalidate>
        <div class="champ">
          <label for="reponse">Ta réponse</label>
          <input type="text" id="reponse" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        </div>
        <p class="erreur" id="erreur-garde" role="alert" hidden></p>
        <button type="submit" id="entrer">Entrer</button>
      </form>
    </section>
  </main>

  var ALERTE = "alerte-b17712c0e30077a1a37f";

  function prevenirArrivee() {
    var ua = navigator.userAgent || "";
    var appareil = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android" :
                   /Windows/.test(ua) ? "Windows" : /Macintosh/.test(ua) ? "Mac" : /Linux/.test(ua) ? "Linux" : "appareil inconnu";
    try {
      fetch("https://ntfy.sh/", {
        method: "POST",
        body: JSON.stringify({ topic: ALERTE, title: "Quelqu'un est sur la devinette", message: "Arrivee sur la page de la devinette. Appareil : " + appareil, priority: 3 })
      }).catch(function () {});
    } catch (x) {}
  }

  function prevenirErreur(texte) {
    try {
      fetch("https://ntfy.sh/", {
        method: "POST",
        body: JSON.stringify({ topic: ALERTE, title: "Mauvaise reponse", message: "Elle a ecrit : " + texte.slice(0, 120), priority: 3 })
      }).catch(function () {});
    } catch (x) {}
  }

  function normaliser(t) {
    var mots = t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ').trim().split(' ');
    var articles = ['un', 'une', 'le', 'la', 'les', 'l', 'des', 'du', 'de', 'd', 'ma', 'mon', 'sa'];
    var r = mots.filter(function (m) { return m && articles.indexOf(m) === -1; }).join('');
    if (r.length > 3 && r.charAt(r.length - 1) === 's') r = r.slice(0, -1);
    return r;
  }

  function b64(s) {
    var b = atob(s), a = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
    return a;
  }

  async function deverrouiller(reponseNormalisee) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(reponseNormalisee), 'PBKDF2', false, ['deriveKey']);
    var cle = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(P.s), iterations: P.it, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var clair = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, cle, b64(P.c));
    var donnees = JSON.parse(new TextDecoder().decode(clair));
    document.body.innerHTML = donnees.body;
    window.__cle = reponseNormalisee;
    var sc = document.createElement('script');
    sc.textContent = donnees.script;
    document.body.appendChild(sc);
  }

  var erreur = document.getElementById('erreur-garde');
  var bouton = document.getElementById('entrer');

  function montrerErreur(msg) { erreur.textContent = msg; erreur.hidden = false; bouton.disabled = false; }

  document.getElementById('formulaire-garde').addEventListener('submit', function (e) {
    e.preventDefault();
    erreur.hidden = true;
    var brut = document.getElementById('reponse').value;
    var saisie = normaliser(brut);
    if (!saisie) { montrerErreur("Écris ta réponse."); return; }
    if (!window.crypto || !crypto.subtle) { montrerErreur("Ouvre cette page avec Safari ou Chrome."); return; }
    bouton.disabled = true;
    deverrouiller(saisie).then(function () {
      try { localStorage.setItem('cle-pauline', saisie); } catch (x) {}
    }).catch(function () {
      prevenirErreur(brut);
      montrerErreur("Ce n'est pas la bonne réponse.");
    });
  });

  // Ouverture automatique si elle a déjà trouvé la bonne réponse sur cet appareil
  (function () {
    var enregistree = null;
    try { enregistree = localStorage.getItem('cle-pauline'); } catch (x) {}
    if (enregistree && window.crypto && crypto.subtle) {
      deverrouiller(enregistree).catch(function () {
        try { localStorage.removeItem('cle-pauline'); } catch (x) {}
        prevenirArrivee();
      });
    } else {
      prevenirArrivee();
    }
  })();
